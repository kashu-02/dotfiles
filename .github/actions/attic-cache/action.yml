name: Attic over Cloudflare WARP
description: Connect to the home Attic cache through a private hostname route
inputs:
  team-name:
    description: Cloudflare Zero Trust team name (without .cloudflareaccess.com)
    required: true
  hostname:
    description: Attic private hostname
    default: attic.kashu.internal
  client-id:
    description: Service token client ID authorized for WARP device enrollment
    required: true
  client-secret:
    description: Service token client secret authorized for WARP device enrollment
    required: true
  attic-token:
    description: Attic token with pull and push permissions on main
    required: true
outputs:
  enabled:
    description: Whether the cache connection was configured
    value: ${{ steps.setup.outputs.enabled }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        CF_TEAM_NAME: ${{ inputs.team-name }}
        ATTIC_HOSTNAME: ${{ inputs.hostname }}
        CF_ACCESS_CLIENT_ID: ${{ inputs.client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.client-secret }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
